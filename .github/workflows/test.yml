name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        shell: bash
        run: node --test tests/unit/*.test.mjs
        env:
          MODEL_LADDER_NO_UPDATE_CHECK: '1'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Tracked files only, so node_modules and .claude/worktrees are never checked.
      - name: Syntax check
        run: git ls-files -z '*.mjs' '*.js' | xargs -0 -n1 node --check
      # Installed on the fly (major pinned) so package.json gains no dependency; --ignore-scripts skips the node-pty native build.
      - name: ESLint
        run: |
          npm install --no-save --ignore-scripts eslint@9 @eslint/js@9
          npx eslint .
      - name: Generated rules match workflows/ladder.js
        run: node scripts/sync-rules.mjs --check

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version bumped when the plugin changed
        run: node .github/scripts/check-version.mjs
